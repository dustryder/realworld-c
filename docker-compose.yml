services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p@ssw0rd
      POSTGRES_DB: realworld
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "5433:5432"